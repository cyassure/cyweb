<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Consultation — Cycentra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        hsl(220, 25%, 6%);
      --card:      hsl(220, 22%, 10%);
      --border:    hsl(220, 15%, 18%);
      --primary:   hsl(185, 85%, 50%);
      --primary-fg:hsl(220, 25%, 6%);
      --fg:        hsl(210, 20%, 92%);
      --muted:     hsl(215, 15%, 55%);
      --input-bg:  hsl(220, 18%, 14%);
      --radius:    0.75rem;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    /* subtle grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(hsl(220 15% 18% / 0.3) 1px, transparent 1px),
        linear-gradient(90deg, hsl(220 15% 18% / 0.3) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 4px 40px hsl(0 0% 0% / 0.4);
    }
    .badge {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      color: var(--fg);
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.03em;
    }
    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      padding: 0.65rem 0.875rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px hsl(185 85% 50% / 0.12);
    }
    select option { background: var(--card); }
    textarea { resize: vertical; min-height: 100px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem 1.5rem;
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.2s;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.1); }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover { color: var(--primary); }
    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
      .card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Cycentra</span>
    <h1>Book a Consultation</h1>
    <p class="subtitle">Tell us about your environment. A Cycentra expert will reach out within one business day.</p>
    <form
      action="https://formsubmit.co/sales@cycentra.com"
      method="POST"
    >
      <!-- FormSubmit config -->
      <input type="hidden" name="_subject" value="New Consultation Request — Cycentra" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_next" value="https://cycentra.com/thank-you.html" />
      <div class="row">
        <div class="form-group">
          <label for="first_name">First Name *</label>
          <input id="first_name" name="first_name" type="text" placeholder="Jan" required />
        </div>
        <div class="form-group">
          <label for="last_name">Last Name *</label>
          <input id="last_name" name="last_name" type="text" placeholder="de Vries" required />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Work Email *</label>
        <input id="email" name="email" type="email" placeholder="jan@company.com" required />
      </div>
      <div class="form-group">
        <label for="company">Company / Organisation *</label>
        <input id="company" name="company" type="text" placeholder="Acme Security BV" required />
      </div>
      <div class="row">
        <div class="form-group">
          <label for="role">Your Role</label>
          <select id="role" name="role">
            <option value="">Select…</option>
            <option>CISO / CTO</option>
            <option>SOC Manager</option>
            <option>Security Analyst</option>
            <option>IT Manager</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="org_size">Organisation Size</label>
          <select id="org_size" name="org_size">
            <option value="">Select…</option>
            <option>1–50</option>
            <option>51–200</option>
            <option>201–500</option>
            <option>500+</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="challenge">What is your primary security challenge?</label>
        <textarea id="challenge" name="challenge" placeholder="e.g. fragmented log sources, lack of detection coverage, compliance requirements…"></textarea>
      </div>
      <div class="form-group">
        <label for="preferred_time">Preferred Meeting Time (optional)</label>
        <input id="preferred_time" name="preferred_time" type="text" placeholder="e.g. Weekdays 10:00–12:00 CET" />
      </div>
      <button class="btn" type="submit">
        Submit Request
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>
    <a class="back" href="https://cycentra.com">← Back to cycentra.com</a>
  </div>
</body>
</html>
