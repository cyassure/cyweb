<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Cy360 deployment topology</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98ab"/>
    </marker>
    <style>
      .box{fill:#121821;stroke:#2b3646;stroke-width:1.5}
      .core{fill:#0f2a30;stroke:#13d8ec;stroke-width:1.5}
      .data{fill:#1a1830;stroke:#8b7cf6;stroke-width:1.5}
      .opt{fill:#121821;stroke:#4b5565;stroke-width:1.2;stroke-dasharray:5 4}
      .ext{fill:#1f1a12;stroke:#f5a524;stroke-width:1.5}
      .t{fill:#e6edf5;font-size:15px;font-weight:600}
      .s{fill:#9aa7b8;font-size:12px}
      .h{fill:#9aa7b8;font-size:12px;letter-spacing:1.5px;font-weight:600}
      .l{stroke:#8b98ab;stroke-width:1.4;fill:none}
      .lab{fill:#9aa7b8;font-size:11px}
    </style>
  </defs>
  <rect width="1000" height="640" rx="14" fill="#0b0e13"/>

  <!-- clients -->
  <rect class="box" x="140" y="20" width="250" height="52" rx="8"/>
  <text class="t" x="265" y="43" text-anchor="middle">Browsers</text>
  <text class="s" x="265" y="61" text-anchor="middle">analysts · administrators</text>
  <rect class="box" x="610" y="20" width="250" height="52" rx="8"/>
  <text class="t" x="735" y="43" text-anchor="middle">Endpoints</text>
  <text class="s" x="735" y="61" text-anchor="middle">CyEDR agents (Windows · macOS · Linux)</text>
  <path class="l" d="M265 72V112" marker-end="url(#a)"/>
  <path class="l" d="M735 72V112" marker-end="url(#a)"/>
  <text class="lab" x="275" y="96">HTTPS</text>
  <text class="lab" x="745" y="96">HTTPS · outbound only</text>

  <!-- host -->
  <rect x="30" y="116" width="940" height="388" rx="12" fill="none" stroke="#2b3646" stroke-width="1.5"/>
  <text class="h" x="50" y="140">YOUR SERVER · DOCKER COMPOSE · TLS REVERSE PROXY IN FRONT</text>

  <rect class="core" x="60" y="160" width="200" height="74" rx="8"/>
  <text class="t" x="160" y="190" text-anchor="middle">frontend</text>
  <text class="s" x="160" y="210" text-anchor="middle">web portal (React)</text>

  <rect class="core" x="370" y="160" width="250" height="74" rx="8"/>
  <text class="t" x="495" y="190" text-anchor="middle">backend</text>
  <text class="s" x="495" y="210" text-anchor="middle">REST API · modules · scheduler · AI</text>

  <rect class="core" x="720" y="160" width="220" height="74" rx="8"/>
  <text class="t" x="830" y="190" text-anchor="middle">correlation engine</text>
  <text class="s" x="830" y="210" text-anchor="middle">correlate · UEBA · ML · scoring</text>

  <path class="l" d="M260 197H366" marker-end="url(#a)"/>
  <text class="lab" x="300" y="190">/api</text>
  <path class="l" d="M624 197H716" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- data tier -->
  <rect class="data" x="60" y="290" width="190" height="70" rx="8"/>
  <text class="t" x="155" y="319" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="155" y="339" text-anchor="middle">system of record · RLS</text>
  <rect class="data" x="280" y="290" width="150" height="70" rx="8"/>
  <text class="t" x="355" y="319" text-anchor="middle">Redis</text>
  <text class="s" x="355" y="339" text-anchor="middle">cache · queues</text>
  <rect class="data" x="460" y="290" width="150" height="70" rx="8"/>
  <text class="t" x="535" y="319" text-anchor="middle">Redpanda</text>
  <text class="s" x="535" y="339" text-anchor="middle">event bus</text>
  <rect class="data" x="640" y="290" width="140" height="70" rx="8"/>
  <text class="t" x="710" y="319" text-anchor="middle">ingest-worker</text>
  <text class="s" x="710" y="339" text-anchor="middle">bus → lake</text>
  <rect class="data" x="810" y="290" width="130" height="70" rx="8"/>
  <text class="t" x="875" y="319" text-anchor="middle">ClickHouse</text>
  <text class="s" x="875" y="339" text-anchor="middle">CyDataLake</text>

  <path class="l" d="M495 234V262H155V286" marker-end="url(#a)"/>
  <path class="l" d="M355 262V286" marker-end="url(#a)"/>
  <path class="l" d="M535 262V286" marker-end="url(#a)"/>
  <path class="l" d="M830 234V262H535"/>
  <path class="l" d="M610 325H636" marker-end="url(#a)"/>
  <path class="l" d="M780 325H806" marker-end="url(#a)"/>

  <!-- optional -->
  <rect class="opt" x="60" y="400" width="260" height="70" rx="8"/>
  <text class="t" x="190" y="429" text-anchor="middle">AI gateway relays</text>
  <text class="s" x="190" y="449" text-anchor="middle">optional · inspects AI &amp; web traffic</text>
  <rect class="opt" x="370" y="400" width="250" height="70" rx="8"/>
  <text class="t" x="495" y="429" text-anchor="middle">updater sidecar</text>
  <text class="s" x="495" y="449" text-anchor="middle">optional · updates from the portal</text>
  <rect class="opt" x="670" y="400" width="270" height="70" rx="8"/>
  <text class="t" x="805" y="429" text-anchor="middle">OpenVAS / GVM</text>
  <text class="s" x="805" y="449" text-anchor="middle">optional · Deep attack-surface scans</text>

  <!-- external -->
  <path class="l" d="M500 504V540" marker-end="url(#a)"/>
  <text class="lab" x="510" y="527">outbound HTTPS only</text>
  <rect class="ext" x="30" y="546" width="940" height="76" rx="10"/>
  <text class="h" x="50" y="569">EXTERNAL SERVICES (NO CUSTOMER DATABASE IS HOSTED BY CYASSURE)</text>
  <text class="s" x="50" y="592">CyTIM threat intelligence &amp; sandbox · CyMind Cloud AI relay (optional) · AI providers with your own keys</text>
  <text class="s" x="50" y="610">CyAssure licensing &amp; Marketplace catalogue · OSV, Microsoft MSRC, CISA KEV and EPSS vulnerability feeds</text>
</svg>
