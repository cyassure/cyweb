<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run a Pilot — CyAssure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        hsl(220, 25%, 6%);
      --card:      hsl(220, 22%, 10%);
      --border:    hsl(220, 15%, 18%);
      --primary:   hsl(185, 85%, 50%);
      --primary-fg:hsl(220, 25%, 6%);
      --fg:        hsl(210, 20%, 92%);
      --muted:     hsl(215, 15%, 55%);
      --input-bg:  hsl(220, 18%, 14%);
      --radius:    0.75rem;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(hsl(220 15% 18% / 0.3) 1px, transparent 1px),
        linear-gradient(90deg, hsl(220 15% 18% / 0.3) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 4px 40px hsl(0 0% 0% / 0.4);
    }
    .badge {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      color: var(--fg);
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    /* Pilot info strip */
    .pilot-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .info-item {
      background: hsl(185 85% 50% / 0.06);
      border: 1px solid hsl(185 85% 50% / 0.2);
      border-radius: 0.5rem;
      padding: 0.75rem 0.6rem;
      text-align: center;
    }
    .info-item .val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      display: block;
    }
    .info-item .lbl {
      font-size: 0.7rem;
      color: var(--muted);
      display: block;
      margin-top: 0.2rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.03em;
    }
    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      padding: 0.65rem 0.875rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px hsl(185 85% 50% / 0.12);
    }
    select option { background: var(--card); }
    textarea { resize: vertical; min-height: 90px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    /* Data sources checkboxes */
    .sources {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }
    .src-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--fg);
      cursor: pointer;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.45rem 0.6rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .src-item:has(input:checked) {
      border-color: hsl(185 85% 50% / 0.6);
      background: hsl(185 85% 50% / 0.06);
    }
    .src-item input[type="checkbox"] {
      width: 0.9rem;
      height: 0.9rem;
      flex-shrink: 0;
      accent-color: var(--primary);
      padding: 0;
      border: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem 1.5rem;
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover { color: var(--primary); }
    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
      .pilot-info { grid-template-columns: 1fr; }
      .sources { grid-template-columns: 1fr; }
      .card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">CyAssure · Free Pilot</span>
    <h1>Run a Pilot</h1>
    <p class="subtitle">Experience Cy360 in your own environment — no commitment, no cost. We deploy it, you see real results within 30 days.</p>

    <div class="pilot-info">
      <div class="info-item">
        <span class="val">30 days</span>
        <span class="lbl">Pilot duration</span>
      </div>
      <div class="info-item">
        <span class="val">No cost</span>
        <span class="lbl">Free to start</span>
      </div>
      <div class="info-item">
        <span class="val">&lt; 30 min</span>
        <span class="lbl">To go live</span>
      </div>
    </div>

    <form action="https://formsubmit.co/sales@cyassure.eu" method="POST">
      <input type="hidden" name="_subject" value="New Pilot Request — CyAssure" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_next" value="https://cyassure.eu/thank-you.html" />

      <div class="row">
        <div class="form-group">
          <label for="first_name">First Name *</label>
          <input id="first_name" name="first_name" type="text" placeholder="Jan" required />
        </div>
        <div class="form-group">
          <label for="last_name">Last Name *</label>
          <input id="last_name" name="last_name" type="text" placeholder="de Vries" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Work Email *</label>
        <input id="email" name="email" type="email" placeholder="jan@company.com" required />
      </div>

      <div class="form-group">
        <label for="company">Company / Organisation *</label>
        <input id="company" name="company" type="text" placeholder="Acme Security BV" required />
      </div>

      <div class="row">
        <div class="form-group">
          <label for="role">Your Role</label>
          <select id="role" name="role">
            <option value="">Select…</option>
            <option>CISO / CTO</option>
            <option>SOC Manager</option>
            <option>Security Analyst</option>
            <option>IT Manager</option>
            <option>Founder / CEO</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="user_count">Approx. user / seat count</label>
          <input id="user_count" name="user_count" type="number" min="1" placeholder="e.g. 150" />
        </div>
      </div>

      <div class="form-group">
        <label>Log / data sources in your environment</label>
        <div class="sources">
          <label class="src-item"><input type="checkbox" name="source_firewall" value="Firewall logs" /> Firewall logs</label>
          <label class="src-item"><input type="checkbox" name="source_endpoint" value="Endpoint / EDR" /> Endpoint / EDR</label>
          <label class="src-item"><input type="checkbox" name="source_cloud" value="Cloud (AWS/Azure/GCP)" /> Cloud (AWS/Azure/GCP)</label>
          <label class="src-item"><input type="checkbox" name="source_identity" value="Identity / AD / Entra" /> Identity / AD / Entra</label>
          <label class="src-item"><input type="checkbox" name="source_email" value="Email gateway" /> Email gateway</label>
          <label class="src-item"><input type="checkbox" name="source_network" value="Network traffic" /> Network traffic</label>
          <label class="src-item"><input type="checkbox" name="source_syslog" value="Syslog / OS" /> Syslog / OS</label>
          <label class="src-item"><input type="checkbox" name="source_other" value="Other" /> Other</label>
        </div>
      </div>

      <div class="form-group">
        <label for="compliance">Compliance requirements (optional)</label>
        <select id="compliance" name="compliance">
          <option value="">None / not sure</option>
          <option>NIS2</option>
          <option>ISO 27001</option>
          <option>DORA</option>
          <option>GDPR / AVG</option>
          <option>SOC 2</option>
          <option>HIPAA</option>
          <option>PCI-DSS</option>
          <option>Multiple / other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="goals">What do you want to prove during the pilot? *</label>
        <textarea id="goals" name="goals" placeholder="e.g. Detect lateral movement, reduce alert fatigue, consolidate existing tools, meet NIS2 visibility requirements…" required></textarea>
      </div>

      <button class="btn" type="submit">
        Start My Pilot
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>

    <a class="back" href="https://cyassure.eu">← Back to cyassure.eu</a>
  </div>
</body>
</html>
