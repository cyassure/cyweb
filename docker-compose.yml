version: "3.9"
services:
  cycentra-web:
    image: ghcr.io/cycentra/cycentra.com:latest
    container_name: cycentra-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      # Portal origin allowed by CORS — must match cy360.DOMAIN in production.
      - FRONTEND_URL=${FRONTEND_URL:-https://cy360.cycentra.com}
      # Pre-shared token required in X-CyCentra-Token header when fetching the
      # marketplace catalog. Must match MARKETPLACE_CATALOG_TOKEN in each
      # CyCentra 360 instance's .env. Leave empty to allow open access.
      - MARKETPLACE_CATALOG_TOKEN=${MARKETPLACE_CATALOG_TOKEN:-}