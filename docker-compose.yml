version: "3.9"

volumes:
  marketplace-data:   # shared between nginx and marketplace-api

services:
  cycentra-web:
    image: ghcr.io/cyassure/cycentra.com:latest
    container_name: cycentra-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      # Mount the shared volume over the baked-in marketplace directory so that
      # catalog.json is served live from the volume rather than the image layer.
      - marketplace-data:/usr/share/nginx/html/marketplace
    environment:
      # Portal origin allowed by CORS — must match cy360.DOMAIN in production.
      - FRONTEND_URL=${FRONTEND_URL:-https://cy360.cycentra.com}
      # Pre-shared token required in X-CyCentra-Token header when fetching the
      # marketplace catalog. Must match MARKETPLACE_CATALOG_TOKEN in each
      # CyCentra 360 instance's .env. Leave empty to allow open access.
      - MARKETPLACE_CATALOG_TOKEN=${MARKETPLACE_CATALOG_TOKEN:-}
    depends_on:
      - marketplace-api

  marketplace-api:
    build: ./marketplace-api
    container_name: marketplace-api
    restart: unless-stopped
    volumes:
      - marketplace-data:/data
    environment:
      # Secret known only to CyAdmin — gates publish and submission review.
      - MARKETPLACE_ADMIN_TOKEN=${MARKETPLACE_ADMIN_TOKEN:-}
      # Same token used by CyCentra 360 instances to fetch catalog and submit contributions.
      - MARKETPLACE_CATALOG_TOKEN=${MARKETPLACE_CATALOG_TOKEN:-}
    # Not exposed publicly — nginx proxies /marketplace/api/ to this container.
    expose:
      - "5050"
